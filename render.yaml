services:
    - type: web
    name: openclaw
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: openclaw gateway --port 10000 --host 0.0.0.0 --allow-unconfigured
    healthCheckPath: /
    envVars:
            - key: NODE_ENV
        value: production
            - key: PORT
        value: "10000"
            - key: HOST
        value: "0.0.0.0"
            - key: OPENCLAW_GATEWAY_PORT
        value: "10000"
            - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw
            - key: OPENCLAW_WORKSPACE_DIR
        value: /data/workspace
            - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 1
