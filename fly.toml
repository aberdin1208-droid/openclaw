app = "aberdin-claw"
primary_region = "gru"

[build]
  image = "ghcr.io/openclaw/openclaw:latest"

[[services]]
  internal_port = 18789
  protocol = "tcp"
  auto_stop_machines = "off"
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    path = "/"
